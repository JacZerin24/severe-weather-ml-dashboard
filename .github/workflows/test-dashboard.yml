name: Dashboard regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - nssl-v12.js
      - scripts/check_dashboard.mjs
      - scripts/trend_history.py
      - tests/**
      - .github/workflows/test-dashboard.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check static dashboard and forecast trend calculations
        run: node scripts/check_dashboard.mjs
      - name: Check CWA image history logic
        run: python -m unittest discover -s tests -p 'test_*.py'
