name: Diagnose official NSSL GEFS ML v1.2 image source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-nssl.yml
      - scripts/probe_nssl_source.py

permissions:
  contents: read

jobs:
  investigate-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Inspect public NSSL viewer metadata
        run: python scripts/probe_nssl_source.py
